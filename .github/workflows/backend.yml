name: Backend checks
on:
  push:
    paths: ['server/**', 'contracts/**', 'openapi.json', 'scripts/**', 'infra/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['server/**', 'contracts/**', 'openapi.json', 'scripts/**', 'infra/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_local_backend.py
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code -- README.md openapi.json
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: cxj_test
          MYSQL_USER: cxj_test
          MYSQL_PASSWORD: ci-test-password-only
          MYSQL_ROOT_PASSWORD: ci-root-password-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-password-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Fast integration checks
        working-directory: server
        run: ./mvnw -B -ntp verify
      - name: MySQL integration checks
        working-directory: server
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/cxj_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
          TEST_DB_USERNAME: cxj_test
          TEST_DB_PASSWORD: ci-test-password-only
          TEST_DB_DRIVER: com.mysql.cj.jdbc.Driver
        run: ./mvnw -B -ntp verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packaged application HTTP check
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/cxj_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
          DB_USERNAME: cxj_test
          DB_PASSWORD: ci-test-password-only
          LOCAL_ADMIN_USERNAME: smoke-admin
          LOCAL_ADMIN_PASSWORD: ci-smoke-password-only
          LOCAL_CAPTCHA_TICKET: ci-smoke-captcha-only
        run: python scripts/smoke_backend.py
      - name: Verify staging image and private API listener
        env:
          CXJ_IMAGE: cxj-api:ci
          DB_PASSWORD: ci-compose-only
          MYSQL_ROOT_PASSWORD: ci-compose-root-only
          REDIS_PASSWORD: ci-compose-redis-only
          MEDIA_PUBLIC_ORIGIN: https://staging.example.test
        run: |
          set -eu
          docker build --tag "$CXJ_IMAGE" server
          docker run --rm --entrypoint ffmpeg "$CXJ_IMAGE" -version
          stack=(docker compose -f infra/compose.yml -f infra/compose.staging.yml)
          trap '"${stack[@]}" down -v' EXIT
          umask 077
          env_file="$RUNNER_TEMP/cxj-compose.env"
          : > "$env_file"
          ./scripts/staging_release.sh "$env_file" "$CXJ_IMAGE"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v1/admin/me)" = 401
